name: Deploy Datadog Monitoring

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: datadog-monitoring-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform apply Datadog resources
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: true
      TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
      TF_VAR_datadog_app_key: ${{ secrets.DATADOG_APP_KEY }}
      TF_VAR_datadog_api_url: ${{ vars.DATADOG_API_URL || 'https://api.datadoghq.com' }}
      TF_VAR_environment: ${{ vars.ENVIRONMENT || 'prod' }}
      TF_VAR_service_name: ${{ vars.SERVICE_NAME || 'ssvd-report-store' }}
      TF_VAR_team: ${{ vars.TEAM || 'srisatvam' }}
      TF_VAR_app_url: ${{ vars.APP_URL || 'http://65.0.49.217' }}
      TF_VAR_notification_handles: ${{ vars.DATADOG_NOTIFICATION_HANDLES || '' }}
      TF_VAR_enable_apm_monitors: ${{ vars.ENABLE_APM_MONITORS || 'false' }}
      TF_VAR_enable_log_monitors: ${{ vars.ENABLE_LOG_MONITORS || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight required secrets
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
        run: |
          missing=0
          for name in AWS_ROLE_ARN TF_STATE_BUCKET TF_STATE_LOCK_TABLE DATADOG_API_KEY DATADOG_APP_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Check the matching GitHub repository secret."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          case "$AWS_ROLE_ARN" in
            arn:aws:iam::*:role/*) echo "AWS role ARN secret is present." ;;
            *)
              echo "::error::AWS_GITHUB_ACTIONS_ROLE_ARN must be an IAM role ARN like arn:aws:iam::<account-id>:role/<role-name>."
              exit 1
              ;;
          esac

      - name: Configure AWS credentials for Terraform state
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: st-ob-datadog-terraform
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=datadog/ssvd-report-store/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'ap-south-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Show outputs
        run: terraform output
