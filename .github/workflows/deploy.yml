name: Deploy Datadog Monitoring

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: datadog-monitoring-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform apply Datadog resources
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: true
      TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
      TF_VAR_datadog_app_key: ${{ secrets.DATADOG_APP_KEY }}
      TF_VAR_datadog_api_url: ${{ vars.DATADOG_API_URL || 'https://api.datadoghq.com' }}
      TF_VAR_environment: ${{ vars.ENVIRONMENT || 'prod' }}
      TF_VAR_service_name: ${{ vars.SERVICE_NAME || 'ssvd-report-store' }}
      TF_VAR_team: ${{ vars.TEAM || 'srisatvam' }}
      TF_VAR_app_url: ${{ vars.APP_URL || 'http://65.0.49.217' }}
      TF_VAR_notification_handles: ${{ vars.DATADOG_NOTIFICATION_HANDLES || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Terraform state
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=datadog/ssvd-report-store/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'ap-south-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Show outputs
        run: terraform output
